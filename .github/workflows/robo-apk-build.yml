name: Robo APK Studio Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'APK build variant (debug, release, or task)'
        required: false
        default: 'debug'
      gradle_task:
        description: 'Gradle task to execute'
        required: false
        default: 'assembleDebug'

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Execute Gradle Build
        run: |
          RAW_TASK="${{ inputs.gradle_task || 'assembleDebug' }}"
          CLEAN_TASK="${RAW_TASK#./gradlew }"
          CLEAN_TASK="${CLEAN_TASK#gradle }"
          echo "Running Gradle task: $CLEAN_TASK"
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew $CLEAN_TASK --no-daemon --stacktrace
          else
            gradle $CLEAN_TASK --no-daemon --stacktrace
          fi

      - name: Locate Built APKs
        if: always()
        run: |
          find . -path "*/build/outputs/apk/*.apk" -o -path "*/build/outputs/apk/*/*.apk" || true

      - name: Upload APK Artifact
        if: success() && inputs.build_type != 'task'
        uses: actions/upload-artifact@v4
        with:
          name: robo-apk-${{ inputs.build_type || 'debug' }}-${{ github.run_number }}
          path: |
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error
