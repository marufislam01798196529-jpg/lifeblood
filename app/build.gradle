plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.google.services)
}

android {
    namespace 'com.dinalamin.lifeblood'
    // আপনার এরর অনুযায়ী এটি ৩৬ (36) করা হয়েছে যাতে core-ktx 1.17.0 সাপোর্ট করে
    compileSdk 36 

    defaultConfig {
        applicationId 'com.dinalamin.lifeblood'
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName '2.0'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildFeatures {
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // Basic AndroidX Libraries
    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.constraintlayout

    // --- Firebase Dependencies ---
    // BOM ব্যবহার করলে আলাদা করে ভার্সন লিখতে হয় না
    implementation platform('com.google.firebase:firebase-bom:32.7.0')
    implementation 'com.google.firebase:firebase-auth-ktx'
    implementation 'com.google.firebase:firebase-firestore-ktx'

    // --- Coroutines (await() ফাংশন কাজ করার জন্য এটি বাধ্যতামূলক) ---
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.7.3'

    // --- SwipeRefreshLayout (লগের এরর দূর করার জন্য) ---
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // --- Lifecycle (ViewModel & LiveData) ---
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
}